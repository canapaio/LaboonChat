[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laboon-chat"
version = "0.1.0-alpha"
description = "Secure P2P Messaging Platform - Faithful connections across digital oceans"
readme = "README.md"
license = {text = "GPL-3.0"}
authors = [
    {name = "Torrent-MSG Team", email = "team@laboon-chat.org"}
]
maintainers = [
    {name = "Torrent-MSG Team", email = "team@laboon-chat.org"}
]
keywords = [
    "p2p", "messaging", "chat", "secure", "privacy", 
    "decentralized", "encryption", "torrent", "laboon"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Communications :: Chat",
    "Topic :: Security :: Cryptography",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.9"
dependencies = [
    "asyncio-mqtt>=0.16.1",
    "cryptography>=41.0.0",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "pydantic>=2.5.0",
    "click>=8.1.0",
    "aiodns>=3.1.0",
    "aiofiles>=23.2.0",
    "bcrypt>=4.1.0",
    "PyJWT>=2.8.0",
    "jinja2>=3.1.0",
    "structlog>=23.2.0",
    "rich>=13.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.9.0",
    "flake8>=6.1.0",
    "mypy>=1.6.0",
    "pre-commit>=3.5.0",
]
docs = [
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=1.3.0",
]
performance = [
    "uvloop>=0.19.0",
    "orjson>=3.9.0",
]

[project.scripts]
laboon-chat = "laboon_chat.launcher.laboon_launcher:main"
laboon = "laboon_chat.launcher.laboon_launcher:main"
lc = "laboon_chat.launcher.laboon_launcher:main"

[project.urls]
Homepage = "https://github.com/torrent-msg/LaboonChat"
Repository = "https://github.com/torrent-msg/LaboonChat"
Documentation = "https://laboon-chat.readthedocs.io/"
"Bug Reports" = "https://github.com/torrent-msg/LaboonChat/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
laboon_chat = [
    "ui/templates/*.html",
    "ui/static/css/*.css", 
    "ui/static/js/*.js",
    "config/*.json",
    "config/*.yaml",
]

# Black configuration
[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# MyPy configuration
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]