[tool:pytest]
# Configurazione pytest per LaboonChat2

# Directory dei test
testpaths = tests

# Pattern per i file di test
python_files = test_*.py *_test.py

# Pattern per le classi di test
python_classes = Test*

# Pattern per le funzioni di test
python_functions = test_*

# Marker personalizzati
markers =
    slow: test che richiedono più tempo per l'esecuzione
    integration: test di integrazione tra componenti
    unit: test unitari isolati
    core: test per i componenti core del sistema
    plugins: test per i plugin
    security: test relativi alla sicurezza
    messaging: test per il sistema di messaging
    interface: test per l'interfaccia utente
    network: test per le funzionalità di rete
    config: test per la configurazione
    crypto: test per le funzionalità crittografiche
    async: test asincroni
    mock: test che utilizzano mock
    file_io: test che coinvolgono operazioni su file
    database: test che coinvolgono database
    performance: test di performance
    regression: test di regressione

# Opzioni di default
addopts = 
    --strict-markers
    --strict-config
    --tb=short
    --disable-warnings
    --color=yes
    -ra
    --durations=10

# Timeout per i test asincroni (in secondi)
asyncio_mode = auto
timeout = 300

# Configurazione per i test paralleli
# (richiede pytest-xdist)
# -n auto

# Configurazione coverage
# (richiede pytest-cov)
# --cov=laboon_chat2
# --cov=plugins
# --cov-report=html
# --cov-report=term-missing
# --cov-fail-under=80

# Directory da ignorare
norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    .pytest_cache
    node_modules
    venv
    env

# Filtri per i warning
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:asyncio
    ignore::RuntimeWarning:asyncio

# Configurazione per i test di integrazione
# Variabili d'ambiente per i test
env =
    LABOON_TEST_MODE = true
    LABOON_LOG_LEVEL = DEBUG
    LABOON_CONFIG_DIR = tests/fixtures/config

# Configurazione per i mock
mock_use_standalone_module = true

# Configurazione per i test temporanei
tmp_path_retention_count = 3
tmp_path_retention_policy = failed

# Configurazione per i test di performance
benchmark_only = false
benchmark_sort = mean
benchmark_compare_fail = mean:5%

# Configurazione per i test di sicurezza
security_test_timeout = 60

# Configurazione per i test di rete
network_test_timeout = 30
network_test_retries = 3

# Configurazione per i test di file I/O
file_test_cleanup = true
file_test_temp_dir = tests/temp

# Log level per i test
log_level = INFO
log_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

# Configurazione per i test di database
# (se necessario in futuro)
# database_test_url = sqlite:///:memory:

# Configurazione per i test di cache
# (se necessario in futuro)
# cache_test_backend = memory

# Configurazione per i test di messaggistica
messaging_test_timeout = 10
messaging_test_max_connections = 5

# Configurazione per i test di crittografia
crypto_test_key_size = 2048
crypto_test_iterations = 1000

# Configurazione per i test di interfaccia
interface_test_headless = true
interface_test_timeout = 15

# Configurazione per i test di plugin
plugin_test_isolation = true
plugin_test_cleanup = true

# Configurazione per i test di configurazione
config_test_validation = strict
config_test_backup = true