<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurazione Plugin - {{plugin_name}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .config-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
        }
        .field-group {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border-left: 4px solid #007bff;
        }
        .field-item {
            margin-bottom: 1rem;
        }
        .field-description {
            font-size: 0.875rem;
            color: #6c757d;
            margin-top: 0.25rem;
        }
        .config-header {
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            padding: 2rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }
        .btn-save {
            background: #28a745;
            border: none;
            padding: 0.75rem 2rem;
            font-weight: 500;
        }
        .btn-reset {
            background: #6c757d;
            border: none;
            padding: 0.75rem 2rem;
            font-weight: 500;
        }
        .validation-error {
            color: #dc3545;
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }
        .color-preview {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            border: 2px solid #dee2e6;
            display: inline-block;
            margin-left: 0.5rem;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="config-container">
        <div class="config-header">
            <h1><i class="bi bi-gear-fill"></i> {{plugin_name}}</h1>
            <p class="mb-0">{{description}}</p>
            <small>Versione: {{version}}</small>
        </div>
        
        <form id="configForm">
            {{content}}
            
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-save text-white">
                    <i class="bi bi-check-circle"></i> Salva Configurazione
                </button>
                <button type="button" class="btn btn-reset text-white" onclick="resetForm()">
                    <i class="bi bi-arrow-clockwise"></i> Ripristina
                </button>
                <button type="button" class="btn btn-outline-primary" onclick="exportConfig()">
                    <i class="bi bi-download"></i> Esporta
                </button>
                <button type="button" class="btn btn-outline-secondary" onclick="importConfig()">
                    <i class="bi bi-upload"></i> Importa
                </button>
            </div>
        </form>
    </div>
    
    <input type="file" id="importFile" accept=".json" style="display: none;" onchange="handleImport(event)">
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const pluginId = '{{plugin_id}}';
        const originalConfig = {{original_config}};
        let currentConfig = JSON.parse(JSON.stringify(originalConfig));
        
        {{javascript_code}}
    </script>
</body>
</html>
